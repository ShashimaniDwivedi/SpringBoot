spring.application.name=Jobporal
logging.pattern.console=${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS})\\%cyan(%-5level) %magenta([%thread]) %yellow(%logger{15}) - %blue(%msg%n)}

# Enable H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# H2 Database Configuration
spring.datasource.username=sa
#spring.datasource.url=jdbc:h2:mem:testdb
#from mem to file data will not be lost
#jobportal is file name
spring.datasource.url=jdbc:h2:file:C:\\Users\\manas\\jobportal;AUTO_SERVER=true
spring.datasource.password=

# H2 Driver
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.schema-locations=classpath:sql/jobportal-schema.sql
spring.sql.init.data-locations=classpath:sql/jobportal-data.sql