
spring.application.name=Jobporal

# Console Logging Pattern
logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %cyan(%-5level) %magenta([%thread]) %yellow(%logger{15}) - %blue(%msg%n)

# Enable H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# H2 Database Configuration
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.url=jdbc:h2:file:C:/Users/manas/jobportal;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver

# SQL Initialization
spring.sql.init.schema-locations=classpath:sql/jobportal-schema.sql
spring.sql.init.data-locations=classpath:sql/jobportal-data.sql
